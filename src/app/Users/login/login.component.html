<div class="auth-box">
  <h2 class="auth-title">Sign In</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm" class="auth-form">
    <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="mb-3">
      <label for="name" class="form-label">Username or Email</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="loginData.name"
        class="form-control"
        name="name"
        required
        autocomplete="username"
        placeholder="Enter your username or email"
      />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="loginData.password"
        class="form-control"
        name="password"
        required
        autocomplete="current-password"
        placeholder="Enter your password"
      />
    </div>
    <button type="submit" class="btn btn-success w-100" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
    </button>
    <button type="button" class="back-home-link" (click)="goHome()">
      Back to Home Page
    </button>
  </form>
</div>
